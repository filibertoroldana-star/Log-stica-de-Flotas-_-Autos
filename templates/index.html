<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Logística de Flotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-4">

    <h2 class="mb-4">MÓDULO 2: MANIPULACIÓN Y FILTRADO AVANZADO (Logística de Flotas)</h2>

    <!-- Formulario de Filtros -->
    <form method="POST" class="row g-3 p-4 border rounded bg-light mb-4">
        <div class="col-md-4">
            <label class="form-label">Marca:</label>
            <input type="text" name="marca" class="form-control" placeholder="Ej. Toyota">
        </div>
        <div class="col-md-4">
            <label class="form-label">Km máximo:</label>
            <input type="number" name="km_max" class="form-control" placeholder="Ej. 50000">
        </div>
        <div class="col-md-4">
            <label class="form-label">Año mínimo:</label>
            <input type="number" name="anio_min" class="form-control" placeholder="Ej. 2018">
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Aplicar Buscador</button>
        </div>
    </form>

    <!-- Mensaje de alerta si el año es menor al registrado -->
    {% if mensaje_alerta %}
        <div class="alert alert-warning" role="alert">
            {{ mensaje_alerta }}
        </div>
    {% endif %}

    <h3 class="mt-4">Resultado del Filtro Estricto:</h3>
    <div class="table-responsive">
        {{ tabla_filtrada_html | safe }}
    </div>

    <h3 class="mt-5">Todos los Vehículos:</h3>
    <div class="table-responsive">
        {{ tabla_html | safe }}
    </div>

</body>
</html>
